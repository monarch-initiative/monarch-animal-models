[project]
name = "monarch-animal-models"
version = "0.1.0"
description = "Static catalog and faceted browser of whole-organism disease models from DisMech and the Monarch KG"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "BSD-3-Clause" }
dependencies = [
  "PyYAML>=6.0,<7",
  "duckdb>=1.1,<2",
]

[dependency-groups]
dev = [
  "linkml>=1.8",
  "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/animal_models_browser"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
